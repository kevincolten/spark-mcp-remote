; Drop-in for /opt/homebrew/etc/supervisord.conf (Apple Silicon) or /usr/local/etc/supervisord.conf (Intel).
; Only the sections that differ from Homebrew's default are shown; keep the rest.

[inet_http_server]
; Bind to your Tailscale IP (tailscale ip -4) so the UI is reachable from your phone but not the public internet.
; Use 127.0.0.1 if you only ever look at it from the Mac itself.
port=100.x.y.z:9001
username=kevin
password=CHANGE_ME

[include]
files=/opt/homebrew/etc/supervisor.d/*.ini
