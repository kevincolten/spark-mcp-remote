; Install:
;   sed "s#/Users/YOU#$HOME#g; s#=YOU#=$(whoami)#g" supervisor/spark-mcp-remote.ini \
;     > "$(brew --prefix)/etc/supervisor.d/spark-mcp-remote.ini"
;
; The bind address lives in .env (HOST). When it is a Tailscale IP this may
; start before tailscaled has the interface up; the server retries the bind
; itself rather than exiting, so no ordering dependency is needed here.
[program:spark-mcp-remote]
directory=/Users/YOU/Code/spark-mcp-remote
command=/opt/homebrew/bin/node --env-file-if-exists=.env src/server.js
; supervisord must run as your user (brew services, not sudo) so `spark` can reach Spark Desktop's GUI session.
user=YOU
environment=PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin",HOME="/Users/YOU"
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/Users/YOU/Library/Logs/spark-mcp-remote.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
