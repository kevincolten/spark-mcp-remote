; Copy to /opt/homebrew/etc/supervisor.d/spark-mcp-remote.ini and edit the two paths.
[program:spark-mcp-remote]
directory=/Users/YOU/src/spark-mcp-remote
command=/opt/homebrew/bin/node --env-file-if-exists=.env src/server.js
; supervisord must run as your user (brew services, not sudo) so `spark` can reach Spark Desktop's GUI session.
user=YOU
environment=PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin",HOME="/Users/YOU"
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/opt/homebrew/var/log/spark-mcp-remote.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
