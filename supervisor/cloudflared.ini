; Copy to /opt/homebrew/etc/supervisor.d/cloudflared.ini
; Requires ~/.cloudflared/config.yml - see README "Expose it".
[program:cloudflared]
command=/opt/homebrew/bin/cloudflared tunnel run spark-mcp
user=YOU
environment=HOME="/Users/YOU"
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/opt/homebrew/var/log/cloudflared.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
