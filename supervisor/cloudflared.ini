; Copy to /opt/homebrew/etc/supervisor.d/cloudflared.ini
; One-time: cloudflared tunnel login && cloudflared tunnel create spark-mcp && cloudflared tunnel route dns spark-mcp spark-mcp.example.com
[program:cloudflared]
command=/opt/homebrew/bin/cloudflared tunnel run --url http://127.0.0.1:8787 spark-mcp
user=YOU
environment=HOME="/Users/YOU"
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/opt/homebrew/var/log/cloudflared.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
