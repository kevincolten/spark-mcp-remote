; Remotely-managed Cloudflare tunnel "spark-mcp":
;   spark-mcp.austindevs.com -> http://127.0.0.1:8787, catch-all http_status:404.
; Ingress lives in Cloudflare (API/Zero Trust) — there is no local config.yml.
;
; The run token is NOT in this file. supervisor/run-tunnel.sh reads it from
; ~/.cloudflared/spark-mcp.token (chmod 600); .ini files are world-readable and
; are rendered in the supervisord web UI.
;
; Install:
;   sed "s#/Users/YOU#$HOME#g; s#=YOU#=$(whoami)#g" supervisor/cloudflared-spark.ini \
;     > "$(brew --prefix)/etc/supervisor.d/cloudflared-spark.ini"
[program:cloudflared-spark]
command=/bin/bash /Users/YOU/Code/spark-mcp-remote/supervisor/run-tunnel.sh
user=YOU
environment=HOME="/Users/YOU",PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/Users/YOU/Library/Logs/cloudflared-spark.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
